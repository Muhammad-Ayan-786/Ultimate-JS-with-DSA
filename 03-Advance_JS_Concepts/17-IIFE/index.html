<body>

    <h3>IIFE - (Immediately Invoked Function Expression)</h3>
    <p>IIFE is a JavaScript function that runs as soon as it is defined.</p>

    <h4>IIFE Syntax</h4>
    <code>
        (function () {
            ...
            ...
        })();
    </code>

    <p>It is used to avoid pollutin the global namespace, execute an async-await , etc.</p>

    <script src="script.js"></script>

</body>
