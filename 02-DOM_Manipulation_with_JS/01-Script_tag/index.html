    <title>Script Tag</title>

    <style> /* Internal CSS */
        * {
            margin: 0;
            padding: 0;

        }

        body {
            background-color: #333;

            text-align: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        h1 {
            margin: 2rem 0;
            font-size: 3rem;
            text-transform: uppercase;

        }
    </style>
</head>
<body>
    <h1>Script Tag</h1>

    <script> // Inline JS
        console.log("Hello World from Script tag");

    <script src="script.js"></script> <!-- External JS file -->

</html>
