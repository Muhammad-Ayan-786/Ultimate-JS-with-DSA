<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parent and Siblings of Element</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #333;
            color: #fff;
            text-align: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        div {
            margin: 2rem auto;
            padding: 2rem;
            width: 30rem;
            background-color: #555;
            color: #fff;
            border-radius: 0.5rem;
            box-shadow: 0 0 1rem rgba(0, 0, 0, 0.5);
        }

        .first {
            margin: 2rem auto;
            padding: 2rem;
            width: 30rem;
            background-color: #555;
            color: #fff;
            border-radius: 0.5rem;
            box-shadow: 0 0 1rem rgba(0, 0, 0, 0.5);
            font-size: 1.6rem;
        }

        .second {
            margin: 2rem auto;
            padding: 2rem;
            width: 30rem;
            background-color: #555;
            color: #fff;
            border-radius: 0.5rem;
            box-shadow: 0 0 1rem rgba(0, 0, 0, 0.5);
            font-size: 1.6rem;
        }
    </style>
</head>

<!-- First Child of Body -->

<body><div><div class="first">First</div><div class="second">Second</div></div>

    <script src="script.js"></script>
</body>

</html>
